<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let v=10;
        console.log("Initial value:",v);
        function revealmystery()
        {
            try{
                console.log("Inside function_try:",v);
            }
            catch(error){
                console.log(error);
            }
            let v=20;
            console.log("Inside function:",v);
        }
        revealmystery();
        console.log("Outside function:",v)
    </script>
</body>
</html> 

/*With var, JavaScript moves declarations to the top of the function but doesn’t move the value. That’s why a variable will be undefined at first.
With let and const, the variable is hoisted but not usable until it’s declared, accessing it early can cause an error.*/
